# Gaming Content Engine – Docker Compose (Stand: Phase 15)
#
# Enthält die Infrastrukturdienste, die ohne eigenen Code lauffähig sind.
# Backend (FastAPI) + Worker seit Phase 2, Dashboard (Next.js) seit Phase 3.
#
# Start (Kern):         docker compose up -d --build
# Mit Reverse Proxy:    docker compose --profile proxy up -d
# Mit n8n:              docker compose --profile workflow up -d
# Mit Monitoring:       docker compose --profile monitoring up -d
#
# Datenbank, Redis, Backend, Dashboard, n8n und Uptime Kuma sind nur auf 127.0.0.1
# erreichbar; öffentlich nur über Caddy (Profil proxy).

name: gaming-content-engine

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # --- Phase 2: backend (FastAPI), worker (RQ) and one-shot migration ----
  migrate:
    build: ./backend
    image: gaming-content-engine/backend:local
    env_file:
      - path: .env
        required: false  # in CI/validation; production always has .env
    environment: &backend-env
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MEDIA_ROOT: /data/media  # license evidence (Phase 6), media until R2 (Phase 7)
      PIPER_VOICE_DIR: /data/piper-voices  # python -m app.piper_voices fetch (16.11.2026)
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    <<: *logging

  backend:
    image: gaming-content-engine/backend:local
    <<: [*restart, *logging]
    env_file:
      - path: .env
        required: false  # in CI/validation; production always has .env
    environment:
      <<: *backend-env
      BACKUP_DIR: /data/backups
      DEPLOY_HOOK_DIR: /data/deploy-hook
    volumes:
      - media_data:/data/media
      - backup_data:/data/backups:ro
      - piper_voices:/data/piper-voices
      # Instant update (docs/INSTANT_UPDATE.md): shared with the server's watcher.
      # The backend only drops a trigger file here; it has no Docker access.
      - ./infrastructure/deploy-hook:/data/deploy-hook
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal, web]

  worker:
    image: gaming-content-engine/backend:local
    <<: [*restart, *logging]
    env_file:
      - path: .env
        required: false  # in CI/validation; production always has .env
    environment: *backend-env
    volumes:
      - media_data:/data/media
      - piper_voices:/data/piper-voices:ro
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  # --- Phase 4: scheduler (master tick, budget check) ------------------
  scheduler:
    image: gaming-content-engine/backend:local
    <<: [*restart, *logging]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      BACKUP_DIR: /data/backups
    volumes:
      - media_data:/data/media:ro
      - backup_data:/data/backups:ro
    command: ["python", "-m", "app.scheduler"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  # --- Phase 15: daily encrypted database backup with restore test -------
  # Needs BACKUP_PASSPHRASE in .env (without it nothing is written and the
  # dashboard shows a warning). Dumps land in the backup_data volume; copy them
  # off the server as well (see docs/OPERATIONS.md).
  backup:
    image: gaming-content-engine/backend:local
    <<: [*restart, *logging]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      BACKUP_DIR: /data/backups
    command: ["python", "-m", "app.backup", "loop"]
    volumes:
      - backup_data:/data/backups
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  # --- Phase 3: frontend (Next.js dashboard) ---------------------------
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    <<: [*restart, *logging]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks: [web]

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    <<: [*restart, *logging]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Static legal page (infrastructure/legal); values only in .env on the server.
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_UPDATED: ${LEGAL_UPDATED:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
    ports:
      # Private operation behind Cloudflare Tunnel: CADDY_BIND=127.0.0.1 keeps 80/443
      # closed to the internet; cloudflared reaches Caddy internally on port 8080.
      - "${CADDY_BIND:-0.0.0.0}:80:80"
      - "${CADDY_BIND:-0.0.0.0}:443:443"
    volumes:
      # Folder, not the single file: git replaces the file on update, and a file
      # mount would keep showing the old one; deploy.sh reloads Caddy afterwards.
      - ./infrastructure/caddy:/etc/caddy:ro
      - ./infrastructure/legal:/srv/legal:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  # Cloudflare Tunnel (private operation): outbound-only connection to Cloudflare,
  # no open web ports on the server. Public hostname in the Zero Trust dashboard
  # points to http://caddy:8080 and is protected by a Cloudflare Access application.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.5}
    profiles: ["tunnel"]
    <<: [*restart, *logging]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks: [web]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-stable}
    profiles: ["workflow"]
    <<: [*restart, *logging]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    <<: [*restart, *logging]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [internal, web]

networks:
  internal:
  web:

volumes:
  backup_data:
  media_data:
  piper_voices:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  n8n_data:
  uptime_kuma_data:
